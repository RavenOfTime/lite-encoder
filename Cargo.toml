[package]
name = "lite-encoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Rust-native ffmpeg alternative: demux, decode, encode, mux — formats added by priority behind one pipeline."

[[bin]]
name = "liteenc"
path = "src/bin/liteenc/main.rs"

[dependencies]
h264-reader = "0.8"
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }

[features]
default = []
# AV1 encode via rav1e. Off by default: heavy build, only needed for the transcode path.
av1 = ["dep:rav1e"]
# The openh264 reference decoder, used only for testing and validation.
# Off by default and never enabled in a shipping build: it compiles vendored
# C, which is exactly what the pure-Rust decoder exists to avoid. See
# `codec::h264::reference`.
reference-decoder = ["dep:openh264", "dep:openh264-sys2"]

[dependencies.rav1e]
version = "0.8"
optional = true
# Skip the `binaries` and `git_version` defaults (CLI deps, build-time git),
# but keep `asm` and `threading`: without them rav1e is several times slower
# and cannot use more than one core.
default-features = false
features = ["asm", "threading"]

# Only builds under `--features av1`; without this the example breaks
# `cargo test` and `cargo clippy` on a default-feature checkout.
[[example]]
name = "bench_rav1e"
required-features = ["av1"]

[[example]]
name = "bench_av1"
required-features = ["av1"]

[[example]]
name = "quality_av1"
required-features = ["av1"]

[[example]]
name = "bench_av1_parallel"
required-features = ["av1"]

[[test]]
name = "transcode_pts"
required-features = ["av1"]

[[test]]
name = "transcode_webm"
required-features = ["av1"]

[[example]]
name = "gen_h264_multislice_fixture"
required-features = ["reference-decoder"]

# Cisco's H.264 implementation, built from vendored C. Test and validation
# only (differential oracle + bench calibration). Plain optional dependency
# rather than a dev-dependency: Cargo does not allow those to be optional, and
# an unconditional one would force the C toolchain on anyone running
# `cargo test`. Never enable this feature in a shipping build.
[dependencies.openh264]
version = "0.9"
optional = true

# The raw bindings, for the one encoder parameter the safe wrapper does not
# expose: `iEntropyCodingModeFlag`. Without it every synthetic fixture is
# CAVLC, which this decoder does not implement, so the fixtures would exercise
# nothing. Same feature gate, same test-only status.
[dependencies.openh264-sys2]
version = "0.9"
optional = true

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
bytes = "1"
